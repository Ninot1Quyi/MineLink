name: Agent Task
description: Bounded MineLink work item for Ona/Codex cloud worktrees
title: "[agent-task] "
labels:
  - agent-ready
  - agent:ona
  - needs-acceptance-evidence
body:
  - type: markdown
    attributes:
      value: |
        Use one environment, one branch, and one PR for this task. Ona work must select the Platform Codex agent mode; default Ona Agent runs are not accepted as MineLink implementation or verifier evidence. Do not claim product completion from mock, replay, or smoke evidence.
  - type: dropdown
    id: gate
    attributes:
      label: Acceptance gate
      description: Which gate in docs/minelink-acceptance.md does this task advance?
      options:
        - Gate 0: Repository, Install, and Baseline Harness
        - Gate 1: Real NeoForge Mod Runtime
        - Gate 2: server_agent Body and Guard Pipeline
        - Gate 3: Limited Perception
        - Gate 4: MCP Host and Gateway
        - Gate 5: Agent RPC JSON, MCP Compatibility, and Local SDK
        - Gate 6: Container and Crafting
        - Gate 7: Create Adapter
        - Gate 8: Multi-agent, A2A, and Social Runtime
        - Gate 9: Frontier Society and Director
        - Gate 10: Install and Product Packaging
        - Gate 11: Security, Stability, and Release
    validations:
      required: true
  - type: dropdown
    id: agent_mode
    attributes:
      label: Required agent mode
      description: Ona tasks must use the platform Codex option, not the default Ona Agent.
      options:
        - Ona Platform Codex
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task
      description: One-sentence outcome the agent should deliver.
      placeholder: Make Gate 6 quick crafting use the native server result slot for shaped recipes.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Exact files, packages, or modules the agent may change.
      placeholder: |
        Allowed:
        - packages/sdk/**
        - docs/development.md
    validations:
      required: true
  - type: textarea
    id: forbidden
    attributes:
      label: Forbidden changes
      description: Boundaries, assertions, or files this task must not weaken.
      placeholder: |
        - Do not weaken replay assertions.
        - Do not add synthetic output paths.
        - Do not edit MineLinkEndpointBootstrap.java.
    validations:
      required: true
  - type: textarea
    id: mock_reduction
    attributes:
      label: Mock or smoke assumption reduced
      description: State what assumption this work converts toward real product behavior.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Required validation
      description: Commands that must pass before opening or updating the PR.
      value: |
        - [ ] bash scripts/dev/verify-agent-task.sh
        - [ ] real NeoForge e2e if game behavior changes
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Required evidence
      description: Report paths, action URLs, and logs that must be pasted into the PR.
      value: |
        - .minelink-dev/reports/agent-task-summary.md
        - .minelink-dev/reports/artifacts/acceptance-summary.md
        - .minelink-dev/reports/artifacts/acceptance.mp4 when video-required
        - .minelink-dev/reports/artifacts/video-review.md when video-required
        - .minelink-dev/reports/artifacts/video-release-gate.md when video-required
        - .minelink-dev/<scenario>/reports/<scenario>-result.json
    validations:
      required: true
  - type: dropdown
    id: acceptance_video_required
    attributes:
      label: Acceptance video required
      description: Whether this task must render acceptance artifacts.
      options:
        - "yes"
        - "no"
    validations:
      required: true
  - type: input
    id: linked_github_issue
    attributes:
      label: Linked GitHub issue
      description: GitHub issue URL, or this issue URL if self-contained.
      placeholder: https://github.com/Ninot1Quyi/MineLink/issues/45
    validations:
      required: true
  - type: input
    id: linked_linear_issue
    attributes:
      label: Linked Linear issue
      description: Linear issue key or URL. Use none when there is no Linear issue.
      placeholder: LIN-123
    validations:
      required: true
  - type: input
    id: expected_pr
    attributes:
      label: Expected PR title and branch convention
      description: Include the draft PR title and branch name.
      placeholder: Advance Gate 6 native crafting; codex/gh-45-native-crafting
    validations:
      required: true
  - type: textarea
    id: remaining_gaps
    attributes:
      label: Remaining gaps
      description: What this task explicitly does not complete.
    validations:
      required: true
