name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm_config_registry=https://registry.npmjs.org npm audit --audit-level=moderate
      - run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh mine_tree
      - run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh create_smoke
      - run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh craft_smoke
      - run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh craft_negative
      - run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh portal_coop
      - run: MINELINK_SKIP_BUILD=1 bash scripts/dev/soak.sh --runtime mock --iterations 1 --scenarios mine_tree,craft_negative,portal_coop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minelink-dev-evidence
          path: .minelink-dev/
