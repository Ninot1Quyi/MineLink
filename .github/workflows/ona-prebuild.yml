name: Ona Prebuild

on:
  push:
    branches:
      - codex/minelink-mvp-engineering
    paths:
      - ".devcontainer/**"
      - ".github/workflows/ona-prebuild.yml"
      - ".ona/**"
      - "mod/neoforge/build.gradle"
      - "mod/neoforge/gradle.properties"
      - "mod/neoforge/gradle/**"
      - "mod/neoforge/settings.gradle"
      - "scripts/dev/bootstrap-prebuild.sh"
      - "scripts/dev/capture-ona-prebuild-logs.sh"
      - "scripts/dev/summarize-ona-prebuild-phases.mjs"
  workflow_dispatch:
    inputs:
      prebuild_timeout:
        description: Ona prebuild timeout
        required: false
        default: 45m
      snapshot_stale_minutes:
        description: Cancel the refresh if snapshotting remains stale for this many minutes
        required: false
        default: "15"
      environment_class_id:
        description: Optional Ona environment class id for the prebuild
        required: false

permissions:
  contents: read

concurrency:
  group: ona-prebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger:
    name: Refresh Ona prebuild baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Ona CLI
        run: |
          tmp_ona="$(mktemp)"
          curl -o "$tmp_ona" -fsSL "https://app.gitpod.io/releases/cli/stable/gitpod-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m | sed 's/x86_64/amd64/;s/\(arm64\|aarch64\)/arm64/')"
          chmod +x "$tmp_ona"
          sudo mv "$tmp_ona" /usr/local/bin/ona

      - name: Trigger and wait for Ona prebuild baseline
        env:
          ONA_TOKEN: ${{ secrets.ONA_TOKEN }}
          MINELINK_ONA_PROJECT_ID: ${{ vars.MINELINK_ONA_PROJECT_ID || '019ee8ed-9e1b-7cd8-9b1b-af0c8ee27edb' }}
          MINELINK_ONA_PREBUILD_TIMEOUT: ${{ github.event.inputs.prebuild_timeout || '45m' }}
          MINELINK_ONA_ENVIRONMENT_CLASS_ID: ${{ github.event.inputs.environment_class_id || vars.MINELINK_ONA_ENVIRONMENT_CLASS_ID }}
          MINELINK_ONA_SNAPSHOT_STALE_MINUTES: ${{ github.event.inputs.snapshot_stale_minutes || vars.MINELINK_ONA_SNAPSHOT_STALE_MINUTES || '15' }}
          MINELINK_ONA_CLI_TIMEOUT_SECONDS: ${{ vars.MINELINK_ONA_CLI_TIMEOUT_SECONDS || '60' }}
        run: |
          set -euo pipefail
          mkdir -p .minelink-dev/reports
          phase_history=".minelink-dev/reports/ona-prebuild-phase-history.jsonl"
          : > "$phase_history"
          export MINELINK_ONA_PHASE_HISTORY="$phase_history"
          run_ona() {
            timeout "${MINELINK_ONA_CLI_TIMEOUT_SECONDS}s" ona "$@"
          }

          fail_or_use_existing_baseline() {
            local reason="$1"
            local summary_path=".minelink-dev/reports/ona-prebuild.md"
            node scripts/dev/summarize-ona-prebuild-phases.mjs || true

            if [ -n "${completed_baseline_id:-}" ]; then
              {
                echo "# MineLink Ona Prebuild"
                echo
                echo "- Result: partial"
                echo "- Refresh result: failed"
                echo "- Refresh blocker: $reason"
                echo "- Project: \`$MINELINK_ONA_PROJECT_ID\`"
                echo "- Refresh prebuild: \`${prebuild_id:-unknown}\`"
                echo "- Existing completed baseline: \`$completed_baseline_id\`"
                echo "- Branch: \`${GITHUB_REF_NAME:-unknown}\`"
                echo "- Commit: \`${GITHUB_SHA:-unknown}\`"
                echo "- Existing baseline detail: \`.minelink-dev/reports/ona-prebuild-existing-baseline.json\`"
                echo "- Pre-refresh list: \`.minelink-dev/reports/ona-prebuild-before.json\`"
                echo "- Trigger output: \`.minelink-dev/reports/ona-prebuild-trigger.json\`"
                echo "- Final refresh status: \`.minelink-dev/reports/ona-prebuild-status.json\`"
                echo "- Phase history: \`.minelink-dev/reports/ona-prebuild-phase-history.jsonl\`"
                echo "- Phase summary: \`.minelink-dev/reports/ona-prebuild-phase-summary.md\`"
                echo "- Log capture: \`.minelink-dev/reports/ona-prebuild-log-capture.md\`"
                echo
                echo "The failed refresh did not create a new accepted baseline."
                echo "The existing completed project baseline remains usable for task environments; follow-up work must still retry or inspect the failed refresh before claiming a newer baseline."
                echo
                if [ -f .minelink-dev/reports/ona-prebuild-phase-summary.md ]; then
                  cat .minelink-dev/reports/ona-prebuild-phase-summary.md
                fi
              } > "$summary_path"
              echo "::warning title=Ona prebuild refresh partial::$reason; existing completed baseline $completed_baseline_id remains usable"
              echo "Ona prebuild refresh failed: $reason; existing completed baseline $completed_baseline_id remains usable" >&2
              exit 0
            fi

            {
              echo "# MineLink Ona Prebuild"
              echo
              echo "- Result: failed"
              echo "- Blocker: $reason"
              echo "- Project: \`$MINELINK_ONA_PROJECT_ID\`"
              echo "- Refresh prebuild: \`${prebuild_id:-unknown}\`"
              echo "- Branch: \`${GITHUB_REF_NAME:-unknown}\`"
              echo "- Commit: \`${GITHUB_SHA:-unknown}\`"
              echo "- Pre-refresh list: \`.minelink-dev/reports/ona-prebuild-before.json\`"
              echo "- Trigger output: \`.minelink-dev/reports/ona-prebuild-trigger.json\`"
              echo "- Final refresh status: \`.minelink-dev/reports/ona-prebuild-status.json\`"
              echo "- Phase history: \`.minelink-dev/reports/ona-prebuild-phase-history.jsonl\`"
              echo "- Phase summary: \`.minelink-dev/reports/ona-prebuild-phase-summary.md\`"
              echo "- Log capture: \`.minelink-dev/reports/ona-prebuild-log-capture.md\`"
              echo
              if [ -f .minelink-dev/reports/ona-prebuild-phase-summary.md ]; then
                cat .minelink-dev/reports/ona-prebuild-phase-summary.md
              fi
            } > "$summary_path"
            echo "::error title=Ona prebuild refresh failed::$reason; no completed baseline is available"
            exit 1
          }

          if [ -z "${ONA_TOKEN:-}" ]; then
            {
              echo "# MineLink Ona Prebuild"
              echo
              echo "- Result: failed"
              echo "- Blocker: ONA_TOKEN is not available to the workflow runner."
            } > .minelink-dev/reports/ona-prebuild.md
            exit 1
          fi

          run_ona login

          run_ona prebuild list --project-id "$MINELINK_ONA_PROJECT_ID" --format json \
            | tee .minelink-dev/reports/ona-prebuild-before.json
          completed_baseline_id="$(
            node - .minelink-dev/reports/ona-prebuild-before.json .minelink-dev/reports/ona-prebuild-existing-baseline.json <<'NODE'
          const fs = require("node:fs");
          const [listPath, outPath] = process.argv.slice(2);
          const records = JSON.parse(fs.readFileSync(listPath, "utf8"));
          const parseTime = (value) => {
            const ms = Date.parse(value ?? "");
            return Number.isFinite(ms) ? ms : 0;
          };
          const completed = records
            .filter((item) => item?.status?.phase === "PREBUILD_PHASE_COMPLETED")
            .filter((item) => Number(item?.status?.snapshotCompletionPercentage ?? 100) >= 100)
            .sort(
              (left, right) =>
                parseTime(right?.metadata?.updatedAt ?? right?.metadata?.createdAt) -
                parseTime(left?.metadata?.updatedAt ?? left?.metadata?.createdAt),
            );
          const baseline = completed[0] ?? null;
          fs.writeFileSync(outPath, `${JSON.stringify(baseline ?? {}, null, 2)}\n`);
          if (baseline?.id) process.stdout.write(baseline.id);
          NODE
          )"
          active_ids="$(
            node -e '
              const fs = require("node:fs");
              const records = JSON.parse(fs.readFileSync(".minelink-dev/reports/ona-prebuild-before.json", "utf8"));
              const active = new Set(["PREBUILD_PHASE_CREATING", "PREBUILD_PHASE_PENDING", "PREBUILD_PHASE_RUNNING", "PREBUILD_PHASE_STARTING", "PREBUILD_PHASE_SNAPSHOTTING"]);
              for (const item of records) {
                if (active.has(item?.status?.phase)) console.log(item.id);
              }
            '
          )"
          if [ -n "$active_ids" ]; then
            while IFS= read -r prebuild_id; do
              [ -n "$prebuild_id" ] || continue
              echo "Cancelling stale active Ona prebuild $prebuild_id"
              run_ona prebuild cancel "$prebuild_id" || true
            done <<< "$active_ids"
          fi

          trigger_args=(prebuild trigger "$MINELINK_ONA_PROJECT_ID")
          if [ -n "${MINELINK_ONA_ENVIRONMENT_CLASS_ID:-}" ]; then
            trigger_args+=(--environment-class-id "$MINELINK_ONA_ENVIRONMENT_CLASS_ID")
          fi
          run_ona "${trigger_args[@]}" \
            --prebuild-timeout "$MINELINK_ONA_PREBUILD_TIMEOUT" \
            --format json | tee .minelink-dev/reports/ona-prebuild-trigger.json

          prebuild_id="$(
            node -e '
              const fs = require("node:fs");
              const records = JSON.parse(fs.readFileSync(".minelink-dev/reports/ona-prebuild-trigger.json", "utf8"));
              const id = records?.[0]?.id;
              if (!id) process.exit(1);
              console.log(id);
            '
          )"

          deadline=$((SECONDS + 3600))
          snapshot_started_at=0
          snapshot_stale_seconds=$((MINELINK_ONA_SNAPSHOT_STALE_MINUTES * 60))
          while true; do
            if ! run_ona prebuild get "$prebuild_id" --format json | tee .minelink-dev/reports/ona-prebuild-status.json; then
              bash scripts/dev/capture-ona-prebuild-logs.sh || true
              node scripts/dev/summarize-ona-prebuild-phases.mjs || true
              echo "Ona prebuild $prebuild_id status poll failed or exceeded ${MINELINK_ONA_CLI_TIMEOUT_SECONDS}s; cancelling stale refresh" >&2
              run_ona prebuild cancel "$prebuild_id" || true
              fail_or_use_existing_baseline "status poll failed or exceeded ${MINELINK_ONA_CLI_TIMEOUT_SECONDS}s"
            fi
            phase="$(
              node -e '
                const fs = require("node:fs");
                const records = JSON.parse(fs.readFileSync(".minelink-dev/reports/ona-prebuild-status.json", "utf8"));
                const status = records?.[0]?.status ?? {};
                const phase = status.phase ?? "unknown";
                const pct = Number(status.snapshotCompletionPercentage ?? 0);
                const record = {
                  observedAt: new Date().toISOString(),
                  phase,
                  snapshotCompletionPercentage: pct,
                  statusVersion: status.statusVersion ?? null,
                  completionTime: status.completionTime ?? null,
                  environmentId: status.environmentId ?? null
                };
                fs.appendFileSync(process.env.MINELINK_ONA_PHASE_HISTORY, `${JSON.stringify(record)}\n`);
                console.log(`${phase}:${pct}`);
              '
            )"
            echo "Ona prebuild $prebuild_id status: $phase"
            case "$phase" in
              PREBUILD_PHASE_STOPPING:*|PREBUILD_PHASE_SNAPSHOTTING:*)
                if [ ! -f .minelink-dev/reports/ona-prebuild-log-capture.md ]; then
                  bash scripts/dev/capture-ona-prebuild-logs.sh || true
                fi
                ;;
            esac
            if node -e 'const fs = require("node:fs"); const records = JSON.parse(fs.readFileSync(".minelink-dev/reports/ona-prebuild-status.json", "utf8")); process.exit(records?.[0]?.status?.failureMessage ? 0 : 1);' \
              && [ ! -f .minelink-dev/reports/ona-prebuild-log-capture.md ]; then
              bash scripts/dev/capture-ona-prebuild-logs.sh || true
            fi
            case "$phase" in
              PREBUILD_PHASE_COMPLETED:100)
                break
                ;;
              PREBUILD_PHASE_SNAPSHOTTING:*)
                if [ "$snapshot_started_at" -eq 0 ]; then
                  snapshot_started_at=$SECONDS
                elif [ "$snapshot_stale_seconds" -gt 0 ] && [ $((SECONDS - snapshot_started_at)) -ge "$snapshot_stale_seconds" ]; then
                  bash scripts/dev/capture-ona-prebuild-logs.sh || true
                  node scripts/dev/summarize-ona-prebuild-phases.mjs || true
                  echo "Ona prebuild $prebuild_id stayed in snapshotting for at least ${MINELINK_ONA_SNAPSHOT_STALE_MINUTES} minutes; cancelling stale refresh" >&2
                  run_ona prebuild cancel "$prebuild_id" || true
                  fail_or_use_existing_baseline "snapshotting stayed stale for at least ${MINELINK_ONA_SNAPSHOT_STALE_MINUTES} minutes"
                fi
                ;;
              PREBUILD_PHASE_FAILED:*|PREBUILD_PHASE_CANCELLED:*)
                bash scripts/dev/capture-ona-prebuild-logs.sh || true
                node scripts/dev/summarize-ona-prebuild-phases.mjs || true
                echo "Ona prebuild $prebuild_id failed with status $phase" >&2
                fail_or_use_existing_baseline "refresh ended with status $phase"
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              bash scripts/dev/capture-ona-prebuild-logs.sh || true
              node scripts/dev/summarize-ona-prebuild-phases.mjs || true
              echo "Timed out waiting for Ona prebuild $prebuild_id to complete" >&2
              fail_or_use_existing_baseline "timed out waiting for completion"
            fi
            sleep 30
          done

          node scripts/dev/summarize-ona-prebuild-phases.mjs

          {
            echo "# MineLink Ona Prebuild"
            echo
            echo "- Result: passed"
            echo "- Project: \`$MINELINK_ONA_PROJECT_ID\`"
            echo "- Prebuild: \`$prebuild_id\`"
            echo "- Branch: \`${GITHUB_REF_NAME:-unknown}\`"
            echo "- Commit: \`${GITHUB_SHA:-unknown}\`"
            echo "- Trigger output: \`.minelink-dev/reports/ona-prebuild-trigger.json\`"
            echo "- Final status: \`.minelink-dev/reports/ona-prebuild-status.json\`"
            echo "- Phase history: \`.minelink-dev/reports/ona-prebuild-phase-history.jsonl\`"
            echo "- Phase summary: \`.minelink-dev/reports/ona-prebuild-phase-summary.md\`"
            echo "- Log capture: \`.minelink-dev/reports/ona-prebuild-log-capture.md\`"
            echo
            cat .minelink-dev/reports/ona-prebuild-phase-summary.md
          } > .minelink-dev/reports/ona-prebuild.md

      - name: Upload Ona prebuild evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minelink-ona-prebuild
          path: .minelink-dev/reports/
          include-hidden-files: true
