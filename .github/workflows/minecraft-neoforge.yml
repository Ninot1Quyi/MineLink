name: Minecraft NeoForge Smoke

on:
  push:
    branches: ["main", "codex/**", "ona/**", "agent/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - ".devcontainer/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - ".devcontainer/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  neoforge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: ./gradlew --no-daemon build
        working-directory: mod/neoforge
      - name: NeoForge Create smoke
        run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh create_smoke
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
          MINELINK_ENABLE_CREATE: "1"
      - name: NeoForge mine tree smoke
        run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh mine_tree
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
      - name: NeoForge HTTP Gateway mine tree smoke
        run: MINELINK_SKIP_BUILD=1 MINELINK_MCP_TRANSPORT=http MINELINK_WORK_DIR=.minelink-dev/neoforge-http-mine_tree bash scripts/dev/e2e.sh mine_tree
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
      - name: NeoForge container and crafting smoke
        run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh craft_smoke
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
      - name: NeoForge furnace container smoke
        run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh furnace_smoke
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
      - name: NeoForge container and crafting negative smoke
        run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh craft_negative
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
      - name: NeoForge guard boundaries smoke
        run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh guard_boundaries
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
      - name: NeoForge perception shapes smoke
        run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh perception_shapes
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
      - name: NeoForge portal cooperation smoke
        run: MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh portal_coop
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
      - name: NeoForge short stability soak
        run: MINELINK_SKIP_BUILD=1 bash scripts/dev/soak.sh --runtime neoforge --iterations 1 --scenarios furnace_smoke,craft_negative,guard_boundaries,perception_shapes,portal_coop
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
      - name: Summarize MineLink evidence
        if: always()
        run: node scripts/dev/summarize-evidence.mjs --append-step-summary
      - name: Render MineLink acceptance artifacts
        if: always()
        run: node scripts/dev/render-acceptance-video.mjs --task-id "$GITHUB_RUN_ID" --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" --pr-url "$MINELINK_PR_URL"
        env:
          MINELINK_PR_URL: ${{ github.event.pull_request.html_url || github.server_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minelink-neoforge-smoke-evidence
          path: |
            .minelink-dev/
            mod/neoforge/run/logs/
          include-hidden-files: true
