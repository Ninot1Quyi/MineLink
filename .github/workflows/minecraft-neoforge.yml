name: Minecraft NeoForge Smoke

on:
  push:
    branches: ["main", "codex/**", "ona/**", "agent/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - ".devcontainer/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "AGENTS.md"
      - "ARCHITECTURE.md"
      - ".devcontainer/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  neoforge-build:
    name: NeoForge build checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: ./gradlew --no-daemon build
        working-directory: mod/neoforge
      - name: Summarize MineLink evidence
        if: always()
        run: node scripts/dev/summarize-evidence.mjs --append-step-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minelink-neoforge-build-evidence
          path: |
            .minelink-dev/
            mod/neoforge/run/logs/
          include-hidden-files: true

  neoforge-smoke:
    name: NeoForge smoke (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: neoforge-build
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        group: [create, movement, crafting, guards, portal-soak]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - run: npm ci
      - run: npm run build
      - name: Run NeoForge smoke group
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
        run: |
          case "${{ matrix.group }}" in
            create)
              MINELINK_ENABLE_CREATE=1 MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh create_smoke
              ;;
            movement)
              MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh mine_tree
              MINELINK_SKIP_BUILD=1 MINELINK_MCP_TRANSPORT=http MINELINK_WORK_DIR=.minelink-dev/neoforge-http-mine_tree bash scripts/dev/e2e.sh mine_tree
              ;;
            crafting)
              MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh craft_smoke
              MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh furnace_smoke
              MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh craft_negative
              ;;
            guards)
              MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh guard_boundaries
              MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh sleep_smoke
              MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh body_lifecycle
              MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh perception_shapes
              ;;
            portal-soak)
              MINELINK_SKIP_BUILD=1 bash scripts/dev/e2e.sh portal_coop
              MINELINK_SKIP_BUILD=1 bash scripts/dev/soak.sh --runtime neoforge --iterations 1 --scenarios furnace_smoke,craft_negative,guard_boundaries,sleep_smoke,body_lifecycle,perception_shapes,portal_coop
              ;;
            *)
              echo "Unknown NeoForge smoke group: ${{ matrix.group }}" >&2
              exit 2
              ;;
          esac
      - name: Summarize MineLink evidence
        if: always()
        run: node scripts/dev/summarize-evidence.mjs --append-step-summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minelink-neoforge-smoke-evidence-${{ matrix.group }}
          path: |
            .minelink-dev/
            mod/neoforge/run/logs/
          include-hidden-files: true
