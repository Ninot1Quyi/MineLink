name: Minecraft NeoForge Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  neoforge-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - run: npm ci
      - run: npm run build
      - run: bash scripts/dev/e2e.sh mine_tree
        env:
          MINELINK_RUNTIME: neoforge
          MINELINK_ACCEPT_EULA: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minelink-neoforge-smoke-evidence
          path: |
            .minelink-dev/
            mod/neoforge/run/logs/
