name: Devcontainer Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vitest.config.ts"
      - "packages/**"
      - "examples/**"
      - "scripts/dev/**"
      - "mod/neoforge/build.gradle"
      - "mod/neoforge/settings.gradle"
      - "mod/neoforge/gradle.properties"
      - "mod/neoforge/gradlew"
      - "mod/neoforge/gradlew.bat"
      - "mod/neoforge/gradle/**"
      - "mod/neoforge/src/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish GHCR devcontainer image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ninot1quyi/minelink-devcontainer
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          target: runtime
          push: true
          build-args: |
            MINELINK_PREWARM_GRADLE=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image tags
        run: |
          {
            echo "## MineLink devcontainer image"
            echo
            echo "Published image tags:"
            echo
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/' | sed 's/$/`/'
            echo
            echo "Ona must still run \`bash scripts/dev/bootstrap-prebuild.sh\` as a hard gate."
          } >> "$GITHUB_STEP_SUMMARY"
