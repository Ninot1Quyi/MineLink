name: Ona Platform Codex Probe

on:
  push:
    branches:
      - codex/gh-3-agent-factory-pilot
    paths:
      - .github/workflows/ona-platform-codex-probe.yml
      - scripts/dev/start-ona-platform-codex.mjs
      - scripts/dev/fetch-platform-codex-canary.mjs
      - scripts/dev/fetch-platform-codex-video-verifier.mjs
      - scripts/dev/check-agent-factory-secrets.mjs
      - scripts/dev/wait-agent-factory-pr-ci.mjs
      - scripts/dev/check-agent-workbench.sh
  workflow_dispatch:
    inputs:
      mode:
        description: Probe mode
        required: true
        default: discover
        type: choice
        options:
          - discover
          - identity-canary
          - implementation-canary
          - video-verifier-canary
          - full-chain-canary
      codex_agent_id:
        description: Optional Codex app agent id for canary modes
        required: false
      wait_seconds:
        description: AgentService readback wait seconds for canary modes
        required: false
        default: "30"
      task_id:
        description: Task id for implementation-canary mode
        required: false
      target_branch:
        description: Target branch for implementation-canary mode
        required: false
      github_issue:
        description: Optional GitHub issue URL for implementation-canary mode
        required: false
      reviewed_commit:
        description: Reviewed commit for video-verifier-canary mode
        required: false
      create_pr:
        description: Create or update a draft PR after full-chain release gate passes
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      pr_base_branch:
        description: Base branch for create_pr=true
        required: false
        default: codex/minelink-mvp-engineering
      pr_title:
        description: Optional PR title for create_pr=true
        required: false
      branch_wait_seconds:
        description: GitHub branch evidence wait seconds for implementation/video-verifier canary modes
        required: false
        default: "300"
      ci_wait_seconds:
        description: GitHub PR check rollup wait seconds for create_pr=true
        required: false
        default: "900"

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    name: Probe Ona Platform Codex API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install acceptance video renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Ona CLI
        run: |
          tmp_ona="$(mktemp)"
          curl -o "$tmp_ona" -fsSL "https://app.gitpod.io/releases/cli/stable/gitpod-$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m | sed 's/x86_64/amd64/;s/\(arm64\|aarch64\)/arm64/')" 
          chmod +x "$tmp_ona"
          sudo mv "$tmp_ona" /usr/local/bin/ona

      - name: Authenticate Ona CLI
        env:
          ONA_TOKEN: ${{ secrets.ONA_TOKEN }}
        run: |
          if [ -z "${ONA_TOKEN:-}" ]; then
            echo "ONA_TOKEN is missing; cannot probe Ona Platform Codex API."
            exit 1
          fi
          ona login

      - name: Report credential context
        env:
          GH_TOKEN: ${{ github.token }}
          ONA_TOKEN: ${{ secrets.ONA_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          AGENT_FACTORY_GITHUB_TOKEN: ${{ secrets.AGENT_FACTORY_GITHUB_TOKEN }}
        run: |
          node scripts/dev/check-agent-factory-secrets.mjs --repo "$GITHUB_REPOSITORY" --require-github-secrets --require-ona-context

      - name: Probe Ona Platform Codex API
        env:
          ONA_TOKEN: ${{ secrets.ONA_TOKEN }}
          MINELINK_ONA_PROJECT_ID: ${{ vars.MINELINK_ONA_PROJECT_ID || '019ee8ed-9e1b-7cd8-9b1b-af0c8ee27edb' }}
          MINELINK_ONA_ORGANIZATION_ID: ${{ vars.MINELINK_ONA_ORGANIZATION_ID }}
          MINELINK_ONA_CODEX_AGENT_ID: ${{ secrets.MINELINK_ONA_CODEX_AGENT_ID }}
          INPUT_CODEX_AGENT_ID: ${{ inputs.codex_agent_id }}
          INPUT_MODE: ${{ inputs.mode || 'identity-canary' }}
          INPUT_WAIT_SECONDS: ${{ inputs.wait_seconds || '30' }}
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
          INPUT_GITHUB_ISSUE: ${{ inputs.github_issue }}
        run: |
          args=(scripts/dev/start-ona-platform-codex.mjs --discover-policies)
          if [ "$INPUT_MODE" = "identity-canary" ] || [ "$INPUT_MODE" = "implementation-canary" ] || [ "$INPUT_MODE" = "full-chain-canary" ]; then
            codex_agent_id="${INPUT_CODEX_AGENT_ID:-${MINELINK_ONA_CODEX_AGENT_ID:-}}"
            if [ -z "$codex_agent_id" ]; then
              echo "$INPUT_MODE mode requires inputs.codex_agent_id or secret MINELINK_ONA_CODEX_AGENT_ID."
              exit 1
            fi
            if [ "$INPUT_MODE" = "identity-canary" ]; then
              args+=(--start --identity-canary --codex-agent-id "$codex_agent_id" --wait-seconds "${INPUT_WAIT_SECONDS:-30}")
            else
              task_id="${INPUT_TASK_ID:-platform-codex-canary-${GITHUB_RUN_ID}}"
              target_branch="${INPUT_TARGET_BRANCH:-codex/platform-codex-canary-${GITHUB_RUN_ID}}"
              {
                echo "MINELINK_PLATFORM_CODEX_TASK_ID=$task_id"
                echo "MINELINK_PLATFORM_CODEX_TARGET_BRANCH=$target_branch"
              } >> "$GITHUB_ENV"
              args+=(
                --start
                --implementation-canary
                --codex-agent-id "$codex_agent_id"
                --task-id "$task_id"
                --branch "$target_branch"
                --github-issue "${INPUT_GITHUB_ISSUE:-}"
                --wait-seconds "${INPUT_WAIT_SECONDS:-600}"
              )
            fi
          fi
          node "${args[@]}"

      - name: Fetch implementation canary branch evidence
        if: ${{ (inputs.mode || 'identity-canary') == 'implementation-canary' || (inputs.mode || 'identity-canary') == 'full-chain-canary' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BRANCH_WAIT_SECONDS: ${{ inputs.branch_wait_seconds || '300' }}
        run: |
          node scripts/dev/fetch-platform-codex-canary.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$MINELINK_PLATFORM_CODEX_TARGET_BRANCH" \
            --task-id "$MINELINK_PLATFORM_CODEX_TASK_ID" \
            --wait-seconds "${INPUT_BRANCH_WAIT_SECONDS:-300}"
          branch_commit="$(node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync('.minelink-dev/reports/ona-codex-implementation-session.json','utf8')); console.log(report.commit || '')")"
          echo "MINELINK_PLATFORM_CODEX_REVIEWED_COMMIT=$branch_commit" >> "$GITHUB_ENV"
          node scripts/dev/check-platform-codex-evidence.mjs \
            --implementation \
            --task-id "$MINELINK_PLATFORM_CODEX_TASK_ID" \
            --branch "$MINELINK_PLATFORM_CODEX_TARGET_BRANCH" \
            --commit "$branch_commit"

      - name: Render canary acceptance video request
        if: ${{ (inputs.mode || 'identity-canary') == 'full-chain-canary' || (inputs.mode || 'identity-canary') == 'video-verifier-canary' }}
        env:
          INPUT_TASK_ID: ${{ inputs.task_id }}
          INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
          INPUT_REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
        run: |
          task_id="${MINELINK_PLATFORM_CODEX_TASK_ID:-${INPUT_TASK_ID:-platform-codex-canary-${GITHUB_RUN_ID}}}"
          target_branch="${MINELINK_PLATFORM_CODEX_TARGET_BRANCH:-${INPUT_TARGET_BRANCH:-codex/platform-codex-canary-${GITHUB_RUN_ID}}}"
          reviewed_commit="${MINELINK_PLATFORM_CODEX_REVIEWED_COMMIT:-${INPUT_REVIEWED_COMMIT:-$(git rev-parse --short HEAD)}}"
          {
            echo "MINELINK_PLATFORM_CODEX_TASK_ID=$task_id"
            echo "MINELINK_PLATFORM_CODEX_TARGET_BRANCH=$target_branch"
            echo "MINELINK_PLATFORM_CODEX_REVIEWED_COMMIT=$reviewed_commit"
          } >> "$GITHUB_ENV"
          bash scripts/dev/verify-agent-task.sh --scope docs
          node scripts/dev/render-acceptance-video.mjs \
            --task-id "$task_id" \
            --branch "$target_branch" \
            --task-requirements docs/minelink-acceptance.md \
            --require-mp4
          node scripts/dev/prepare-video-review-request.mjs \
            --task-id "$task_id" \
            --branch "$target_branch" \
            --task-requirements docs/minelink-acceptance.md \
            --require-mp4

      - name: Start Ona Platform Codex video verifier canary
        if: ${{ (inputs.mode || 'identity-canary') == 'full-chain-canary' || (inputs.mode || 'identity-canary') == 'video-verifier-canary' }}
        env:
          ONA_TOKEN: ${{ secrets.ONA_TOKEN }}
          MINELINK_ONA_PROJECT_ID: ${{ vars.MINELINK_ONA_PROJECT_ID || '019ee8ed-9e1b-7cd8-9b1b-af0c8ee27edb' }}
          MINELINK_ONA_ORGANIZATION_ID: ${{ vars.MINELINK_ONA_ORGANIZATION_ID }}
          MINELINK_ONA_CODEX_AGENT_ID: ${{ secrets.MINELINK_ONA_CODEX_AGENT_ID }}
          INPUT_CODEX_AGENT_ID: ${{ inputs.codex_agent_id }}
          INPUT_WAIT_SECONDS: ${{ inputs.wait_seconds || '900' }}
          INPUT_GITHUB_ISSUE: ${{ inputs.github_issue }}
        run: |
          codex_agent_id="${INPUT_CODEX_AGENT_ID:-${MINELINK_ONA_CODEX_AGENT_ID:-}}"
          if [ -z "$codex_agent_id" ]; then
            echo "video verifier canary mode requires inputs.codex_agent_id or secret MINELINK_ONA_CODEX_AGENT_ID."
            exit 1
          fi
          node scripts/dev/start-ona-platform-codex.mjs \
            --discover-policies \
            --start \
            --video-verifier-canary \
            --codex-agent-id "$codex_agent_id" \
            --task-id "$MINELINK_PLATFORM_CODEX_TASK_ID" \
            --branch "$MINELINK_PLATFORM_CODEX_TARGET_BRANCH" \
            --commit "$MINELINK_PLATFORM_CODEX_REVIEWED_COMMIT" \
            --github-issue "${INPUT_GITHUB_ISSUE:-}" \
            --video-review-request .minelink-dev/reports/artifacts/video-review-request.md \
            --wait-seconds "${INPUT_WAIT_SECONDS:-900}" \
            --output .minelink-dev/reports/ona-platform-codex-video-verifier-api-session.md \
            --json-output .minelink-dev/reports/ona-platform-codex-video-verifier-api-session.json

      - name: Fetch video verifier canary branch evidence
        if: ${{ (inputs.mode || 'identity-canary') == 'full-chain-canary' || (inputs.mode || 'identity-canary') == 'video-verifier-canary' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MODE: ${{ inputs.mode || 'identity-canary' }}
          INPUT_BRANCH_WAIT_SECONDS: ${{ inputs.branch_wait_seconds || '300' }}
        run: |
          node scripts/dev/fetch-platform-codex-video-verifier.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$MINELINK_PLATFORM_CODEX_TARGET_BRANCH" \
            --task-id "$MINELINK_PLATFORM_CODEX_TASK_ID" \
            --commit "$MINELINK_PLATFORM_CODEX_REVIEWED_COMMIT" \
            --wait-seconds "${INPUT_BRANCH_WAIT_SECONDS:-300}"
          node scripts/dev/check-video-review.mjs --require-mp4
          evidence_args=(--verifier)
          chain_args=(--require-platform-codex-verifier)
          if [ "$INPUT_MODE" = "full-chain-canary" ]; then
            evidence_args+=(--implementation)
            chain_args+=(--require-platform-codex-implementation)
          fi
          node scripts/dev/check-platform-codex-evidence.mjs \
            "${evidence_args[@]}" \
            --task-id "$MINELINK_PLATFORM_CODEX_TASK_ID" \
            --branch "$MINELINK_PLATFORM_CODEX_TARGET_BRANCH" \
            --commit "$MINELINK_PLATFORM_CODEX_REVIEWED_COMMIT"
          node scripts/dev/report-agent-factory-chain.mjs \
            --github-issue "${{ inputs.github_issue }}" \
            --github-dispatcher-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --ona-prebuild-status passed \
            --ona-automation-status partial \
            --branch "$MINELINK_PLATFORM_CODEX_TARGET_BRANCH" \
            --commit "$MINELINK_PLATFORM_CODEX_REVIEWED_COMMIT" \
            --task-id "$MINELINK_PLATFORM_CODEX_TASK_ID" \
            "${chain_args[@]}"

      - name: Create or update canary PR after release gate
        if: ${{ (inputs.mode || 'identity-canary') == 'full-chain-canary' && inputs.create_pr == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_FACTORY_GITHUB_TOKEN || github.token }}
          INPUT_PR_BASE_BRANCH: ${{ inputs.pr_base_branch || 'codex/minelink-mvp-engineering' }}
          INPUT_PR_TITLE: ${{ inputs.pr_title }}
          INPUT_GITHUB_ISSUE: ${{ inputs.github_issue }}
        run: |
          pr_title="${INPUT_PR_TITLE:-Advance ${MINELINK_PLATFORM_CODEX_TASK_ID}}"
          node scripts/dev/create-agent-factory-pr.mjs \
            --branch "$MINELINK_PLATFORM_CODEX_TARGET_BRANCH" \
            --base "${INPUT_PR_BASE_BRANCH:-codex/minelink-mvp-engineering}" \
            --title "$pr_title" \
            --task-id "$MINELINK_PLATFORM_CODEX_TASK_ID" \
            --github-issue "${INPUT_GITHUB_ISSUE:-none}" \
            --linear-issue none \
            --acceptance-gate unspecified \
            --validation-scope docs
          pr_url="$(node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync('.minelink-dev/reports/agent-factory-pr.json','utf8')); console.log(report.prUrl || '')")"
          if [ -z "$pr_url" ]; then
            echo "create-agent-factory-pr did not report a PR URL."
            exit 1
          fi
          echo "MINELINK_AGENT_FACTORY_PR_URL=$pr_url" >> "$GITHUB_ENV"

      - name: Wait for canary PR CI
        if: ${{ (inputs.mode || 'identity-canary') == 'full-chain-canary' && inputs.create_pr == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AGENT_FACTORY_GITHUB_TOKEN || github.token }}
          INPUT_CI_WAIT_SECONDS: ${{ inputs.ci_wait_seconds || '900' }}
        run: |
          node scripts/dev/wait-agent-factory-pr-ci.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --pr-url "$MINELINK_AGENT_FACTORY_PR_URL" \
            --wait-seconds "${INPUT_CI_WAIT_SECONDS:-900}"
          ci_url="$(node -e "const fs=require('fs'); const report=JSON.parse(fs.readFileSync('.minelink-dev/reports/agent-factory-pr-ci.json','utf8')); console.log(report.checksUrl || '')")"
          if [ -z "$ci_url" ]; then
            echo "wait-agent-factory-pr-ci did not report a checks URL."
            exit 1
          fi
          echo "MINELINK_AGENT_FACTORY_CI_URL=$ci_url" >> "$GITHUB_ENV"

      - name: Refresh chain report after canary PR
        if: ${{ (inputs.mode || 'identity-canary') == 'full-chain-canary' && inputs.create_pr == 'true' }}
        run: |
          node scripts/dev/report-agent-factory-chain.mjs \
            --github-issue "${{ inputs.github_issue }}" \
            --github-dispatcher-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --ona-prebuild-status passed \
            --ona-automation-status partial \
            --branch "$MINELINK_PLATFORM_CODEX_TARGET_BRANCH" \
            --commit "$MINELINK_PLATFORM_CODEX_REVIEWED_COMMIT" \
            --task-id "$MINELINK_PLATFORM_CODEX_TASK_ID" \
            --pr-url "$MINELINK_AGENT_FACTORY_PR_URL" \
            --pr-report .minelink-dev/reports/agent-factory-pr.md \
            --ci-url "$MINELINK_AGENT_FACTORY_CI_URL" \
            --require-platform-codex-implementation \
            --require-platform-codex-verifier

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minelink-ona-platform-codex-probe
          path: .minelink-dev/reports/
          include-hidden-files: true
