tasks:
  bootstrap-prebuild:
    name: Bootstrap MineLink prebuild runtime
    command: |
      MINELINK_PREBUILD_SKIP_GRADLE=1 bash scripts/dev/bootstrap-prebuild.sh --prebuild
    prebuildRequiresSuccess: true
    triggeredBy:
      - prebuild

  verify-docs:
    name: Verify MineLink docs and agent workbench
    command: |
      bash scripts/dev/verify-agent-task.sh --scope docs
    triggeredBy:
      - postDevcontainerStart

  verify-fast:
    name: Run MineLink fast verification
    command: |
      bash scripts/dev/verify-agent-task.sh --scope fast
    triggeredBy:
      - manual

  verify-neoforge-guard:
    name: Run MineLink real NeoForge guard smoke
    command: |
      MINELINK_RUNTIME=neoforge MINELINK_ACCEPT_EULA=1 bash scripts/dev/verify-agent-task.sh --scope neoforge --scenarios guard_boundaries
    triggeredBy:
      - manual

  render-acceptance-evidence:
    name: Render MineLink acceptance evidence artifacts
    command: |
      node scripts/dev/report-agent-factory-chain.mjs
      node scripts/dev/summarize-evidence.mjs
      node scripts/dev/render-acceptance-video.mjs --task-id "${MINELINK_TASK_ID:-manual}" --branch "$(git rev-parse --abbrev-ref HEAD)" --task-requirements "${MINELINK_TASK_REQUIREMENTS:-manual evidence render}" --producer "${MINELINK_ACCEPTANCE_VIDEO_PRODUCER:-ona-task-finalizer}" --require-mp4
      node scripts/dev/prepare-video-review-request.mjs --task-id "${MINELINK_TASK_ID:-manual}" --branch "$(git rev-parse --abbrev-ref HEAD)" --task-requirements "${MINELINK_TASK_REQUIREMENTS:-manual evidence render}" --require-mp4
    triggeredBy:
      - manual

  report-agent-factory-chain:
    name: Report MineLink issue-to-PR factory chain status
    command: |
      node scripts/dev/report-agent-factory-chain.mjs
    triggeredBy:
      - manual

  prepare-video-review:
    name: Prepare MineLink video review request
    command: |
      node scripts/dev/prepare-video-review-request.mjs --task-id "${MINELINK_TASK_ID:-manual}" --branch "$(git rev-parse --abbrev-ref HEAD)" --task-requirements "${MINELINK_TASK_REQUIREMENTS:-manual evidence render}" --require-mp4
    triggeredBy:
      - manual

  check-video-release:
    name: Check MineLink acceptance video release gate
    command: |
      node scripts/dev/check-video-review.mjs --require-mp4 --require-producer "${MINELINK_ACCEPTANCE_VIDEO_REQUIRED_PRODUCER:-${MINELINK_ACCEPTANCE_VIDEO_PRODUCER:-ona-task-finalizer}}"
    triggeredBy:
      - manual

  cleanup-ona-resources:
    name: Stop completed MineLink Ona task environment
    command: |
      node scripts/dev/cleanup-ona-resources.mjs --project-id "${MINELINK_ONA_PROJECT_ID:-}" --stop --dont-wait
    triggeredBy:
      - manual

  sync-linear-status:
    name: Sync MineLink task status back to Linear
    command: |
      node scripts/dev/sync-linear-status.mjs \
        --issue "${MINELINK_LINEAR_ISSUE:-}" \
        --status "${MINELINK_LINEAR_STATUS:-In Review}" \
        --comment "${MINELINK_LINEAR_COMMENT:-MineLink Ona environment status sync completed.}" \
        --attachment-title "${MINELINK_LINEAR_ATTACHMENT_TITLE:-MineLink evidence}" \
        --attachment-url "${MINELINK_LINEAR_ATTACHMENT_URL:-}"
    triggeredBy:
      - manual
