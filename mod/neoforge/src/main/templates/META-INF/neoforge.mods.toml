modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Ninot1Quyi/MineLink/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Ninot1Quyi/MineLink"
authors="MineLink contributors"
description='''
MineLink gives external AI agents a server_agent body, limited perception, and legal motor primitives in Minecraft.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Create remains optional in the MVP. Add a required Create dependency only for a Create-adapter build.
