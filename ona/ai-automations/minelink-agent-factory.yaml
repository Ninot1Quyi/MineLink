name: minelink-agent-factory
description: >
  MineLink issue-to-PR validation factory. Public Ona automation agent steps
  currently start the default Ona Agent, so this spec fails closed unless a
  separate Ona Platform Codex session has already written accepted platform
  selector/API evidence. Required mode: Ona Platform Codex agent.
triggers:
  - context:
      projects:
        projectIds:
          - 019ee8ed-9e1b-7cd8-9b1b-af0c8ee27edb
    manual: {}
action:
  limits:
    maxParallel: 1
    maxTotal: 6
  steps:
    - task:
        command: |
          if node scripts/dev/check-platform-codex-evidence.mjs \
            --implementation \
            --task-id "{{ .Parameters.task_id }}" \
            --branch "{{ .Parameters.branch }}" >/tmp/minelink-platform-codex-implementation-check.log 2>&1; then
            exit 0
          fi
          mkdir -p .minelink-dev/reports
          cat > .minelink-dev/reports/ona-codex-implementation-session.md <<EOF
          Agent mode: blocked_before_platform_codex
          Identity: unavailable
          Platform evidence: missing_public_ona_automation_codex_selector
          Session id: none
          Result: blocked
          Task id: {{ .Parameters.task_id }}
          Branch: {{ .Parameters.branch }}
          Commit: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          Validation: not_run
          Evidence: .minelink-dev/reports/platform-codex-evidence.md
          Remaining gaps: Public Ona automation agent steps start the default Ona Agent (Ai-Automations Action Execution). Ona docs currently document Codex launch through an environment conversation menu with Codex selected, not a public automation YAML or CLI provider selector. Start a real Ona Platform Codex session or add a documented Codex automation API before implementation.
          EOF
    - task:
        command: >
          node scripts/dev/run-agent-factory-stage.mjs
          --stage implementation-finalize
          --task-id "{{ .Parameters.task_id }}"
          --github-issue "{{ .Parameters.github_issue }}"
          --linear-issue "{{ .Parameters.linear_issue }}"
          --ona-project "{{ .Parameters.ona_project }}"
          --ona-automation "{{ .Parameters.ona_automation }}"
          --branch "{{ .Parameters.branch }}"
          --pr-title "{{ .Parameters.pr_title }}"
          --acceptance-gate "{{ .Parameters.acceptance_gate }}"
          --validation-scope "{{ .Parameters.validation_scope }}"
          --scenarios "{{ .Parameters.scenarios }}"
          --video-producer "ona-task-finalizer"
          --required-video-producer "ona-task-finalizer"
    - task:
        command: |
          if node scripts/dev/check-platform-codex-evidence.mjs \
            --implementation \
            --verifier \
            --task-id "{{ .Parameters.task_id }}" \
            --branch "{{ .Parameters.branch }}" >/tmp/minelink-platform-codex-verifier-check.log 2>&1; then
            exit 0
          fi
          mkdir -p .minelink-dev/reports
          cat > .minelink-dev/reports/ona-codex-video-verifier-session.md <<EOF
          Agent mode: blocked_before_platform_codex
          Identity: unavailable
          Platform evidence: missing_public_ona_automation_codex_selector
          Session id: none
          Result: blocked
          Task id: {{ .Parameters.task_id }}
          Branch: {{ .Parameters.branch }}
          Commit: $(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          Evidence: .minelink-dev/reports/platform-codex-evidence.md
          Remaining gaps: Public Ona automation agent steps start the default Ona Agent, so the separate Platform Codex video-verifier session must be started through a proven Codex surface before release can continue.
          EOF
    - task:
        command: |
          set +e
          node scripts/dev/run-agent-factory-stage.mjs \
            --stage release-finalize \
            --task-id "{{ .Parameters.task_id }}" \
            --github-issue "{{ .Parameters.github_issue }}" \
            --linear-issue "{{ .Parameters.linear_issue }}" \
            --ona-project "{{ .Parameters.ona_project }}" \
            --ona-automation "{{ .Parameters.ona_automation }}" \
            --branch "{{ .Parameters.branch }}" \
            --pr-title "{{ .Parameters.pr_title }}" \
            --acceptance-gate "{{ .Parameters.acceptance_gate }}" \
            --validation-scope "{{ .Parameters.validation_scope }}" \
            --scenarios "{{ .Parameters.scenarios }}" \
            --video-producer "ona-task-finalizer" \
            --required-video-producer "ona-task-finalizer"
          release_status=$?
          node scripts/dev/cleanup-ona-resources.mjs \
            --project-id "{{ .Parameters.ona_project }}" \
            --stop \
            --dont-wait || true
          exit "$release_status"
