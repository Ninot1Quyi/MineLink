name: minelink-agent-factory
description: >
  MineLink issue-to-PR agent factory. Start this automation from a GitHub or
  Linear task that already satisfies the MineLink agent task contract.
triggers:
  - context:
      projects:
        projectIds:
          - 019ee8ed-9e1b-7cd8-9b1b-af0c8ee27edb
    manual: {}
action:
  limits:
    maxParallel: 2
    maxTotal: 6
  steps:
    - task:
        command: >
          node scripts/dev/sync-linear-status.mjs
          --issue "{{ .Parameters.linear_issue }}"
          --status "In Progress"
          --comment "Ona automation started for {{ .Parameters.task_id }} on branch {{ .Parameters.branch }}. Source issue: {{ .Parameters.issue_url }}"
          --attachment-title "MineLink source task {{ .Parameters.task_id }}"
          --attachment-url "{{ .Parameters.issue_url }}"
          --require-key
          --require-update
    - agent:
        prompt: |
          You are working on MineLink through the Ona agent execution environment,
          not a manual SSH shell. Read AGENTS.md, ARCHITECTURE.md,
          docs/minelink-acceptance.md, docs/agent-workbench.md, and
          docs/linear-ona-agent-factory.md before editing.

          Task id: {{ .Parameters.task_id }}
          Source issue: {{ .Parameters.issue_url }}
          Linked Linear issue: {{ .Parameters.linear_issue }}
          Linked GitHub issue: {{ .Parameters.github_issue }}
          Target branch: {{ .Parameters.branch }}
          Acceptance gate: {{ .Parameters.acceptance_gate }}
          Validation scope: {{ .Parameters.validation_scope }}
          Scenarios: {{ .Parameters.scenarios }}
          Task instruction: {{ .Parameters.agent_instruction }}

          Follow the task instruction exactly. Keep the work bounded to the
          issue scope. For pilot or validation tasks, do not edit files unless
          the instruction explicitly asks for edits. Preserve MineLink anti-mock
          boundaries: do not weaken assertions, do not add oracle tools, do not
          replace real Minecraft behavior with synthetic output, and do not
          claim product acceptance from mock or smoke evidence. Commit messages,
          PR text, comments, and code comments must be English.
    - task:
        command: >
          bash scripts/dev/verify-agent-task.sh --scope {{ .Parameters.validation_scope }} --scenarios {{ .Parameters.scenarios }}
    - task:
        command: >
          node scripts/dev/summarize-evidence.mjs &&
          node scripts/dev/render-acceptance-video.mjs
          --task-id {{ .Parameters.task_id }}
          --branch {{ .Parameters.branch }}
          --pr-url {{ .Parameters.issue_url }}
    - task:
        command: >
          node scripts/dev/sync-linear-status.mjs
          --issue "{{ .Parameters.linear_issue }}"
          --status "In Review"
          --comment "Ona validation and acceptance artifact steps completed for {{ .Parameters.task_id }}. Evidence paths: .minelink-dev/reports/agent-task-summary.md, .minelink-dev/reports/ci-evidence-summary.md, .minelink-dev/reports/artifacts/acceptance-summary.md, and .minelink-dev/reports/artifacts/acceptance.mp4 when ffmpeg is available."
          --require-key
          --require-update
    - pullRequest:
        branch: "{{ .Parameters.branch }}"
        description: |
          ## Linked Work

          - Linear: {{ .Parameters.linear_issue }}
          - GitHub: {{ .Parameters.github_issue }}

          ## MineLink Delivery Evidence

          - Agent task id: {{ .Parameters.task_id }}
          - Acceptance gate: {{ .Parameters.acceptance_gate }}
          - Validation scope: {{ .Parameters.validation_scope }}
          - Evidence summary: `.minelink-dev/reports/ci-evidence-summary.md`
          - Agent verifier: `.minelink-dev/reports/agent-task-summary.md`
          - Acceptance video summary: `.minelink-dev/reports/artifacts/acceptance-summary.md`
          - Acceptance video: `.minelink-dev/reports/artifacts/acceptance.mp4` when ffmpeg is available

          This PR must still be reviewed against `docs/minelink-acceptance.md`.
          Mock, replay, smoke, or short-soak evidence does not imply full product
          completion.
        draft: true
        title: "{{ .Parameters.pr_title }}"
    - report:
        outputs:
          - key: minelink_validation_passed
            title: MineLink validation passed
            boolean: {}
            prompt: Did the MineLink validation command complete successfully?
          - key: real_neoforge_ran
            title: Real NeoForge ran
            boolean: {}
            prompt: Did this task run real NeoForge evidence, not only mock or smoke replay?
